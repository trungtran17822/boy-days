<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Golden Men 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&family=Cinzel:wght@600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --gold: #d4af37;
      --gold-bright: #f4e19a;
      --gold-deep: #8a6a12;
      --red: #8b0e1a;
      --red-bright: #c41e3a;
      --neon: #39ffce;
      --black: #07050a;
      --ink: #f7f0dc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--black); color: var(--ink);
      font-family: "Be Vietnam Pro", sans-serif;
      cursor: none;
    }
    #app {
      position: relative; width: 100%; height: 100%;
      transform-origin: center center;
    }
    #app.shake { animation: shake 0.7s ease; }
    @keyframes shake {
      0%,100% { transform: translate(0,0) rotate(0); }
      10% { transform: translate(-8px, 4px) rotate(-0.6deg); }
      20% { transform: translate(9px, -5px) rotate(0.6deg); }
      30% { transform: translate(-7px, 3px) rotate(-0.4deg); }
      40% { transform: translate(8px, 6px) rotate(0.5deg); }
      50% { transform: translate(-4px, -3px) rotate(-0.3deg); }
      60% { transform: translate(5px, 2px) rotate(0.2deg); }
      80% { transform: translate(-2px, 1px); }
    }
    .bg {
      position: absolute; inset: 0; z-index: 0;
      background: linear-gradient(135deg, #12060b, #1a0a08 30%, #0b1220 70%, #14080e);
      background-size: 400% 400%;
      animation: bgShift 18s ease infinite;
    }
    @keyframes bgShift {
      0% { background-position: 0% 40%; }
      50% { background-position: 100% 60%; }
      100% { background-position: 0% 40%; }
    }
    .red-carpet {
      position: absolute; left: 50%; bottom: -8%;
      width: 58vmin; height: 78%;
      transform: translateX(-50%) perspective(600px) rotateX(58deg);
      background: repeating-linear-gradient(90deg, #6b0b14 0 18px, #8d121e 18px 36px);
      box-shadow: 0 0 80px rgba(196,30,58,.35);
      opacity: 0.55; pointer-events: none; z-index: 1;
    }
    #fx, #fireworks { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .vignette {
      position: absolute; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.72) 100%);
    }
    .spot {
      position: absolute; width: 42vmax; height: 42vmax; border-radius: 50%;
      pointer-events: none; z-index: 2; mix-blend-mode: screen; filter: blur(18px);
    }
    .spot.a {
      background: radial-gradient(circle, rgba(244,225,154,.28), transparent 62%);
      animation: spotA 7s ease-in-out infinite;
    }
    .spot.b {
      background: radial-gradient(circle, rgba(57,255,206,.12), transparent 62%);
      animation: spotB 9s ease-in-out infinite;
    }
    @keyframes spotA {
      0% { top: -10%; left: -8%; }
      50% { top: 18%; left: 62%; }
      100% { top: -10%; left: -8%; }
    }
    @keyframes spotB {
      0% { bottom: -12%; right: -10%; }
      50% { bottom: 22%; right: 55%; }
      100% { bottom: -12%; right: -10%; }
    }
    .scan {
      position: absolute; top: 0; width: 18vw; height: 100%; z-index: 2;
      background: linear-gradient(90deg, transparent, rgba(244,225,154,.12), transparent);
      animation: scan 5.5s linear infinite; pointer-events: none;
    }
    @keyframes scan { from { left: -20%; } to { left: 110%; } }

    #slides {
      position: relative; z-index: 5; width: 100%; height: 100%;
      perspective: 1400px;
    }
    .slide {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transform: translate3d(0, 0, 0);
      will-change: transform, opacity;
    }
    .slide.active { opacity: 1; pointer-events: auto; }

    .inner {
      width: min(1100px, 92vw); max-height: 86vh;
      text-align: center; position: relative;
    }

    .kicker {
      letter-spacing: .38em; text-transform: uppercase;
      color: var(--gold); font-size: clamp(11px, 1.4vw, 14px);
      font-weight: 700; margin-bottom: 12px;
    }
    h1, .display {
      font-family: "Playfair Display", "Cinzel", serif;
      font-weight: 900; line-height: 1.12;
    }
    .title-letters { display: flex; flex-wrap: wrap; justify-content: center; gap: 0; }
    .title-letters span {
      display: inline-block; font-family: "Playfair Display", serif;
      font-size: clamp(28px, 5.4vw, 72px); font-weight: 900;
      color: #fff6d2; text-shadow: 0 0 18px rgba(212,175,55,.7), 0 0 40px rgba(196,30,58,.35);
      opacity: 0; transform: translateY(40px) rotateX(70deg);
    }
    .title-letters span.space { width: .35em; }
    .neon {
      color: var(--neon); text-shadow: 0 0 8px #39ffce, 0 0 22px #39ffce, 0 0 48px #1aa;
    }
    .gold-text {
      background: linear-gradient(180deg, #fff6c8, #d4af37 45%, #8a6a12);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .glitch { position: relative; animation: glitch 2.4s infinite; }
    @keyframes glitch {
      0%,90%,100% { transform: none; text-shadow: 0 0 18px rgba(212,175,55,.4); }
      92% { transform: translate(-2px,1px); text-shadow: 2px 0 #f0f, -2px 0 #0ff; }
      94% { transform: translate(2px,-1px); text-shadow: -2px 0 #f0f, 2px 0 #0ff; }
    }
    .typewriter { border-right: 2px solid var(--gold); padding-right: 4px; white-space: nowrap; overflow: hidden; }
    .bounce-in { animation: bounceIn .8s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes bounceIn {
      0% { transform: scale(.4); opacity: 0; }
      60% { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); }
    }

    .slide-bg-video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; pointer-events: none; z-index: 0;
    }
    .slide > .inner { z-index: 1; }
    .timeline { display: grid; gap: 12px; margin-top: 22px; text-align: left; }
    .stage-card {
      display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center;
      padding: 16px 20px; border: 1px solid rgba(212,175,55,.35);
      background: linear-gradient(90deg, rgba(212,175,55,.08), rgba(0,0,0,.25));
      border-radius: 16px; opacity: 0; transform: translateX(-40px);
      box-shadow: 0 0 0 1px rgba(255,255,255,.03) inset;
    }
    .stage-card .ico {
      width: 64px; height: 64px; border-radius: 50%;
      display: grid; place-items: center; font-size: 28px;
      background: radial-gradient(circle at 30% 30%, #f4e19a, #d4af37 45%, #6a4e0c);
      box-shadow: 0 0 24px rgba(212,175,55,.45);
    }
    .stage-card h3 { font-family: "Playfair Display", serif; color: var(--gold-bright); font-size: 1.25rem; }
    .stage-card p { opacity: .82; font-size: .95rem; margin-top: 4px; }

    .boy-grid {
      display: grid; grid-template-columns: minmax(180px, 280px) 1fr;
      gap: 36px; align-items: center; text-align: left;
    }
    .portrait-wrap {
      position: relative; width: min(280px, 70vw); margin: 0 auto;
      transform-style: preserve-3d;
    }
    .portrait {
      width: 100%; aspect-ratio: 1; border-radius: 50%;
      object-fit: cover; display: block;
      border: 6px solid var(--gold);
      box-shadow: 0 0 0 8px rgba(212,175,55,.18), 0 0 40px rgba(212,175,55,.5), 0 20px 40px rgba(0,0,0,.5);
      background: radial-gradient(circle at 30% 20%, #3a2a12, #111);
    }
    .portrait.fallback {
      display: grid; place-items: center;
      font-family: "Playfair Display", serif; font-size: 4.2rem; color: var(--gold-bright);
    }
    .ring {
      position: absolute; inset: -10px; border-radius: 50%;
      border: 2px dashed rgba(57,255,206,.55);
      animation: spin 14s linear infinite; pointer-events: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .boy-meta .nickname { color: var(--neon); font-style: italic; margin: 6px 0 10px; }
    .badge {
      display: inline-block; padding: 6px 14px; border-radius: 999px;
      border: 1px solid var(--gold); color: var(--gold-bright);
      letter-spacing: .12em; text-transform: uppercase; font-size: 12px; font-weight: 700;
    }
    .bio { margin-top: 16px; line-height: 1.65; opacity: .9; font-size: 1.02rem; }
    .stats { margin-top: 22px; display: grid; gap: 12px; }
    .stat label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; letter-spacing: .08em; }
    .bar {
      height: 12px; border-radius: 999px; background: rgba(255,255,255,.08);
      overflow: hidden; border: 1px solid rgba(212,175,55,.25);
    }
    .bar > i {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, var(--red-bright), var(--gold), var(--neon));
      box-shadow: 0 0 16px rgba(57,255,206,.6);
      border-radius: inherit;
    }

    .gold-frame {
      padding: 40px 32px 36px; border-radius: 18px; position: relative;
      background: radial-gradient(ellipse at 50% 0%, rgba(212,175,55,.18), rgba(10,8,6,.75));
      box-shadow: 0 0 0 2px #d4af37, 0 0 0 8px rgba(212,175,55,.2), 0 0 60px rgba(212,175,55,.35);
    }
    .gold-frame::before, .gold-frame::after {
      content: "✦"; position: absolute; color: var(--gold); font-size: 22px;
    }
    .gold-frame::before { top: 10px; left: 14px; }
    .gold-frame::after { bottom: 10px; right: 14px; }
    .sparkle {
      position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: inherit;
    }
    .sparkle i {
      position: absolute; width: 6px; height: 6px; background: #fff;
      border-radius: 50%; animation: twinkle 2.4s infinite;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0; transform: scale(.3); }
      50% { opacity: 1; transform: scale(1.4); }
    }
    .teacher-photo {
      width: 180px; height: 180px; border-radius: 50%; margin: 8px auto 16px;
      border: 5px solid var(--gold); object-fit: cover;
      box-shadow: 0 0 30px rgba(212,175,55,.55);
    }
    .teacher-photo.fallback { display: grid; place-items: center; font-size: 3.2rem; background: #1a1408; }

    .envelope-scene { position: relative; min-height: 52vh; }
    .countdown {
      font-family: "Cinzel", serif; font-size: clamp(80px, 18vw, 180px);
      color: var(--gold-bright); text-shadow: 0 0 40px rgba(212,175,55,.8);
    }
    .envelope {
      width: min(320px, 70vw); height: 210px; margin: 0 auto; position: relative;
      transform-style: preserve-3d; perspective: 900px;
    }
    .env-body {
      position: absolute; inset: 40px 0 0; background: linear-gradient(#f4e19a, #c9a227);
      border-radius: 6px; box-shadow: 0 20px 40px rgba(0,0,0,.4);
    }
    .env-flap {
      position: absolute; top: 0; left: 0; right: 0; height: 110px;
      background: linear-gradient(#fff6c8, #d4af37);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center; z-index: 2;
    }
    .env-card {
      position: absolute; left: 8%; right: 8%; bottom: 18px; height: 120px;
      background: #1a1208; border: 2px solid var(--gold); color: var(--gold-bright);
      display: grid; place-items: center; font-family: "Playfair Display", serif;
      font-size: 1.4rem; transform: translateY(40px); opacity: 0; z-index: 1;
    }
    .crown {
      font-size: 64px; position: absolute; left: 50%; top: -90px;
      transform: translateX(-50%) translateY(-180px) rotate(-20deg);
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.4));
      opacity: 0;
    }
    .king-name {
      font-size: clamp(32px, 6vw, 68px); margin-top: 18px;
    }

    .wish-block { width: min(920px, 92vw); margin: 0 auto; }
    .wish-block .kicker { font-size: clamp(16px, 2.2vw, 22px); margin-bottom: 22px; }
    .wish-block p {
      font-size: clamp(20px, 2.6vw, 32px);
      line-height: 1.85; font-weight: 400;
      color: #fff8e7;
      text-shadow: 0 2px 14px rgba(0,0,0,.85), 0 0 24px rgba(212,175,55,.2);
    }
    .credits-wrap {
      width: min(960px, 92vw);
      height: 80vh;
      max-height: 820px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      mask-image: linear-gradient(to bottom, transparent 0%, black 14%, black 86%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 14%, black 86%, transparent 100%);
      pointer-events: auto;
    }
    .credits-crawl {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      text-align: center;
      will-change: transform;
      user-select: none;
    }
    .credits-crawl .kicker {
      font-size: clamp(18px, 2.5vw, 28px);
      margin-bottom: 26px;
      color: var(--gold-bright);
      letter-spacing: .25em;
      text-shadow: 0 0 16px rgba(212,175,55,.6);
    }
    .credits-crawl.css-crawl {
      animation: creditsScroll 25s linear infinite;
    }
    .credits-wrap:hover .credits-crawl.css-crawl {
      animation-play-state: paused;
    }
    @keyframes creditsScroll {
      0% { transform: translateY(80vh); }
      100% { transform: translateY(-105%); }
    }
    .finale-huge {
      font-size: clamp(42px, 10vw, 108px);
      letter-spacing: 0.04em;
    }
    .floaters { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 4; }
    .floater { position: absolute; bottom: -40px; animation: rise linear forwards; font-size: 28px; }
    @keyframes rise {
      to { transform: translateY(-110vh) rotate(240deg); opacity: 0; }
    }

    .curtains { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
    .curtain {
      position: absolute; top: 0; width: 51%; height: 100%;
      background:
        repeating-linear-gradient(90deg, #5a0810 0 14px, #7a0e18 14px 28px);
      box-shadow: inset 0 0 80px #2a0308;
      transition: transform 1.6s cubic-bezier(.77,0,.18,1);
    }
    .curtain.left { left: 0; transform-origin: left; }
    .curtain.right { right: 0; transform-origin: right; }
    .curtains.open .left { transform: translateX(-102%); }
    .curtains.open .right { transform: translateX(102%); }

    .flash {
      position: absolute; inset: 0; background: #fff; opacity: 0;
      pointer-events: none; z-index: 30;
    }
    .flash.go { animation: flash .45s ease; }
    @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

    .progress {
      position: absolute; left: 8%; right: 8%; bottom: 18px; height: 4px;
      background: rgba(255,255,255,.12); border-radius: 99px; z-index: 20;
      overflow: hidden;
    }
    .progress > i {
      display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, var(--red-bright), var(--gold), var(--neon));
      transition: width .45s ease;
    }
    .hud {
      position: absolute; z-index: 25; display: flex; gap: 8px; align-items: center;
    }
    .hud.top-right { top: 16px; right: 16px; }
    .hud.bottom { bottom: 32px; left: 50%; transform: translateX(-50%); }
    button.ctrl {
      appearance: none; border: 1px solid rgba(212,175,55,.55);
      background: rgba(0,0,0,.45); color: var(--gold-bright);
      font-family: inherit; font-size: 13px; font-weight: 700;
      padding: 8px 12px; border-radius: 999px; cursor: pointer;
      backdrop-filter: blur(8px); letter-spacing: .04em;
    }
    button.ctrl:hover { background: rgba(212,175,55,.18); }
    .hint {
      position: absolute; bottom: 40px; right: 18px; z-index: 20;
      font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
      opacity: .55;
    }
    .slide-num {
      position: absolute; top: 18px; left: 18px; z-index: 20;
      font-size: 12px; letter-spacing: .2em; color: var(--gold);
    }
    .cursor {
      position: fixed; width: 18px; height: 18px; border: 2px solid var(--gold);
      border-radius: 50%; pointer-events: none; z-index: 80;
      transform: translate(-50%, -50%); mix-blend-mode: difference;
      transition: width .15s, height .15s;
    }

    #gate {
      position: absolute; inset: 0; z-index: 50;
      display: grid; place-items: center; text-align: center;
      background: radial-gradient(circle, #1a080c, #050305);
    }
    #gate h1 { font-size: clamp(28px, 6vw, 64px); margin: 12px 0 20px; }
    #gate .go {
      margin-top: 18px; padding: 14px 28px; font-size: 16px;
    }

    @media (max-width: 760px) {
      .boy-grid { grid-template-columns: 1fr; text-align: center; gap: 18px; }
      .stat label { font-size: 12px; }
      .hint { display: none; }
      .credits-wrap { height: 75vh; }
      .wish-block p, .credits-crawl .wish-block p { font-size: 1.12rem; line-height: 1.75; padding: 0 8px; }
      .credits-crawl .kicker { font-size: 15px; margin-bottom: 16px; }
      .gold-frame { padding: 28px 16px; }
      body { cursor: auto; }
      .cursor { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="bg"></div>
    <div class="red-carpet"></div>
    <div class="spot a"></div>
    <div class="spot b"></div>
    <div class="scan"></div>
    <canvas id="fx"></canvas>
    <canvas id="fireworks"></canvas>
    <div class="floaters" id="floaters"></div>
    <div class="vignette"></div>
    <div class="flash" id="flash"></div>
    <div class="slide-num" id="slideNum"></div>
    <div id="slides"></div>
    <div class="progress"><i id="prog"></i></div>
    <div class="hud top-right">
      <button class="ctrl" id="btnMusic" type="button">♪ Nhạc: Tắt</button>
      <button class="ctrl" id="btnConfetti" type="button">✦ Pháo giấy</button>
      <button class="ctrl" id="btnFull" type="button">⛶ Toàn màn hình</button>
    </div>
    <div class="hint">← → / Space / Click / Vuốt</div>
    <div class="curtains" id="curtains">
      <div class="curtain left"></div>
      <div class="curtain right"></div>
    </div>
    <div id="gate">
      <div>
        <h1 class="gold-text">Golden Men 2026</h1>
        <button class="ctrl go" id="btnStart" type="button">Mở rèm &amp; bắt đầu</button>
      </div>
    </div>
  </div>
  <div class="cursor" id="cursor"></div>
  <video id="bgMusic" loop playsinline preload="auto" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none">
    <source src="music file/So_In_Sync.mp4" type="video/mp4" />

    function cameraFlash() {

    function burstConfetti(opts = {}) {
      if (!window.confetti) return;
      const defaults = { particleCount: 140, spread: 80, origin: { y: 0.65 }, colors: ["#d4af37", "#c41e3a", "#39ffce", "#fff6c8", "#ffffff"] };
      confetti({ ...defaults, ...opts });
      confetti({ ...defaults, ...opts, angle: 60, origin: { x: 0, y: 0.7 } });
      confetti({ ...defaults, ...opts, angle: 120, origin: { x: 1, y: 0.7 } });

    function shake() {

    /* Particles */
    const fx = $("fx");
    const fxc = fx.getContext("2d");
    let particles = [];
    function resizeFx() {
      fx.width = innerWidth; fx.height = innerHeight;
      $("fireworks").width = innerWidth; $("fireworks").height = innerHeight;
    }
    function spawnParticles() {
      particles = Array.from({ length: 90 }, () => ({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.8 + 0.4,
        s: Math.random() * 0.45 + 0.1,
        a: Math.random(),
        tw: Math.random() * Math.PI * 2,
        gold: Math.random() > 0.55
      }));
    }
    function tickParticles() {
      fxc.clearRect(0, 0, fx.width, fx.height);
      for (const p of particles) {
        p.y -= p.s; p.tw += 0.03;
        if (p.y < -4) { p.y = innerHeight + 4; p.x = Math.random() * innerWidth; }
        fxc.globalAlpha = 0.35 + Math.sin(p.tw) * 0.35;
        fxc.fillStyle = p.gold ? "#f4e19a" : "#ffffff";
        fxc.beginPath(); fxc.arc(p.x, p.y, p.r, 0, Math.PI * 2); fxc.fill();
      }
      fxc.globalAlpha = 1;
      requestAnimationFrame(tickParticles);
    }

    /* Fireworks */
    const fw = $("fireworks");
    const fwc = fw.getContext("2d");
    let sparks = [];
    function boom(x, y) {
      const hue = Math.random() > 0.5 ? 45 : 350;
      for (let i = 0; i < 42; i++) {
        const a = (Math.PI * 2 * i) / 42;
        const sp = Math.random() * 4.2 + 1.2;
        sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, hue });
      }
    }
    function tickFireworks() {
      fwc.clearRect(0, 0, fw.width, fw.height);
      sparks = sparks.filter(s => s.life > 0);
      for (const s of sparks) {
        s.x += s.vx; s.y += s.vy; s.vy += 0.04; s.life -= 0.012;
        fwc.globalAlpha = Math.max(s.life, 0);
        fwc.fillStyle = s.hue > 100 ? "#39ffce" : `hsl(${s.hue},90%,60%)`;
        fwc.beginPath(); fwc.arc(s.x, s.y, 2.2, 0, Math.PI * 2); fwc.fill();
      }
      fwc.globalAlpha = 1;
      requestAnimationFrame(tickFireworks);
    }
    function fireworksShow(ms = 3200) {
      const t0 = performance.now();
      const iv = setInterval(() => {
        boom(innerWidth * (0.2 + Math.random() * 0.6), innerHeight * (0.15 + Math.random() * 0.35));
        if (performance.now() - t0 > ms) clearInterval(iv);
      }, 280);
    }

    function spawnFloaters(kind) {
      const box = $("floaters");
      const glyphs = kind === "love" ? ["❤", "🌸", "💐", "✨", "💖"] : ["🎈", "💛", "✨"];

        el.style.animationDuration = 5 + Math.random() * 5 + "s";
        el.style.fontSize = 18 + Math.random() * 22 + "px";
        box.appendChild(el);
        setTimeout(() => el.remove(), 11000);
      }
    }

    /* Audio */
    let actx, master, musicEl, loops = {};
    function audioCtx() {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        master = actx.createGain(); master.gain.value = 0.35; master.connect(actx.destination);
      }
      return actx;
    }
    function beep(freq, dur, type = "triangle", gain = 0.08) {
      const ctx = audioCtx();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = gain; o.connect(g); g.connect(master);
      o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.stop(ctx.currentTime + dur + 0.05);
    }
    function playHook(key, fallback) {
      const src = DATA.audio[key];
      if (src) {
        const a = new Audio(src);
        a.volume = 0.7; a.play().catch(() => fallback && fallback());
        return;
      }
      fallback && fallback();
    }
    function fanfareSynth() {
      [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.28, "square", 0.06), i * 140));
    }
    function drumSynth() {
      for (let i = 0; i < 8; i++) setTimeout(() => beep(80 + i * 4, 0.08, "sawtooth", 0.09), i * 90);
    }
    function applauseSynth() {
      const ctx = audioCtx();
      const bufferSize = 2 * ctx.sampleRate;
      const noise = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = noise;
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1500;
      const g = ctx.createGain(); g.gain.value = 0.12;
      src.connect(bp); bp.connect(g); g.connect(master);
      src.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.8);
      src.stop(ctx.currentTime + 1.9);
    }
    function startMusic() {
      audioCtx();
      if (DATA.audio.music) {
        if (!musicEl) {
          musicEl = $("bgMusic") || new Audio(encodeURI(DATA.audio.music));
          musicEl.loop = true;
          musicEl.volume = 0.55;
        }
        const play = musicEl.play();
        if (play && play.catch) play.catch(() => {});
      } else {
        const ctx = audioCtx();
        if (loops.pad) return;
        const o = ctx.createOscillator(); const o2 = ctx.createOscillator();
        const g = ctx.createGain(); g.gain.value = 0.03;
        o.type = "sine"; o2.type = "sine"; o.frequency.value = 110; o2.frequency.value = 164.8;
        o.connect(g); o2.connect(g); g.connect(master); o.start(); o2.start();
        loops.pad = { o, o2, g };
      }
      musicOn = true; $("btnMusic").textContent = "♪ Nhạc: Bật";
    }
    function stopMusic() {
      if (musicEl) { musicEl.pause(); }
      if (loops.pad) { try { loops.pad.o.stop(); loops.pad.o2.stop(); } catch(e) {} loops.pad = null; }
      musicOn = false; $("btnMusic").textContent = "♪ Nhạc: Tắt";
    }

    /* Transitions */
    function leave(el, name, dir) {
      if (window.gsap) {
        const map = {
          fade: { opacity: 0, duration: 0.45 },
          slide: { x: dir * -120, opacity: 0, duration: 0.55 },
          zoom: { scale: 1.25, opacity: 0, duration: 0.5 },
          spin3d: { rotateY: dir * 80, opacity: 0, duration: 0.6 },
          wipe: { y: dir * 80, opacity: 0, duration: 0.5 },
          curtain: { opacity: 0, duration: 0.2 }
        };
        return gsap.to(el, { ...map[name], ease: "power2.in" });
      }
      el.style.opacity = 0;
    }
    function enter(el, name, dir) {
      if (window.gsap) {
        const from = {
          fade: { opacity: 0 },
          slide: { x: dir * 120, opacity: 0 },
          zoom: { scale: 0.82, opacity: 0 },
          spin3d: { rotateY: dir * -80, opacity: 0 },
          wipe: { y: dir * -80, opacity: 0 },
          curtain: { opacity: 0 }
        };
        gsap.set(el, from[name] || { opacity: 0 });
        return gsap.to(el, { x: 0, y: 0, rotateY: 0, scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" });
      }
      el.style.opacity = 1;
    }

    async function go(to, dir = 1) {
      const list = slides();
      if (locked || to === index || to < 0 || to >= list.length) return;
      locked = true;
      const prev = list[index];
      const next = list[to];
      const name = TRANSITIONS[to % TRANSITIONS.length];

      if (name === "curtain") {
        $("curtains").classList.remove("open");
        await wait(700);
      }

      prev.classList.remove("active");
      leave(prev, name, dir);
      index = to;
      next.classList.add("active");
      enter(next, name, dir);
      updateHud();

      if (name === "curtain") {
        await wait(200);
        $("curtains").classList.add("open");
      }

      await wait(200);
      playEnter(next);
      locked = false;
    }

    function updateHud() {
      const n = slides().length;
      $("slideNum").textContent = `${String(index + 1).padStart(2, "0")} / ${String(n).padStart(2, "0")}`;
      $("prog").style.width = ((index) / (n - 1)) * 100 + "%";
    }

    function playEnter(slide) {
      enterGen++;
      clearInterval(creditsTimer);
      if (creditsTween) {
        creditsTween.kill();
        creditsTween = null;
      }
      const id = slide.dataset.id;
      if (slide.dataset.flash) {
        cameraFlash();
        playHook("applause", applauseSynth);
      }
      if (id === "welcome") animateWelcome(slide);
      if (id === "intro") animateTimeline(slide);
      if (id.startsWith("boy-")) animateBoy(slide);
      if (id.startsWith("teacher-")) animateTeacher(slide);
      if (id === "king") animateKing(slide);
      if (id === "credits") animateCredits();
      if (id === "finale") animateFinale();
    }

    function animateWelcome(slide) {
      const bg = $("slide1Bg");
      if (bg) bg.play().catch(() => {});
      const letters = slide.querySelectorAll(".title-letters span");
      letters.forEach((s, i) => {
        s.style.opacity = 0;
        if (window.gsap) {
          gsap.to(s, { opacity: 1, y: 0, rotateX: 0, delay: 0.04 * i, duration: 0.45, ease: "back.out(1.8)" });
        } else {
          setTimeout(() => { s.style.opacity = 1; s.style.transform = "none"; }, 40 * i);
        }
      });
    }

    function animateTimeline(slide) {
      slide.querySelectorAll(".stage-card").forEach((c, i) => {
        if (window.gsap) gsap.to(c, { opacity: 1, x: 0, delay: 0.18 * i, duration: 0.55, ease: "power3.out" });
        else setTimeout(() => { c.style.opacity = 1; c.style.transform = "none"; }, 180 * i);
      });
    }

    function animateBoy(slide) {
      const wrap = slide.querySelector(".portrait-wrap");
      if (window.gsap) gsap.fromTo(wrap, { scale: 0.2, rotate: -12, opacity: 0 }, { scale: 1, rotate: 0, opacity: 1, duration: 0.7, ease: "back.out(1.8)" });
      slide.querySelectorAll(".bar > i").forEach((bar, i) => {
        const to = bar.dataset.to;
        bar.style.width = "0";
        if (window.gsap) gsap.to(bar, { width: to + "%", delay: 0.35 + i * 0.18, duration: 0.9, ease: "power2.out" });
        else setTimeout(() => bar.style.width = to + "%", 350 + i * 180);
      });
    }

    function animateTeacher() {
      playHook("fanfare", fanfareSynth);
      burstConfetti({ particleCount: 80, spread: 55 });
    }

    async function animateKing(slide) {
      const gen = enterGen;
      const countEl = $("countEl");
      const env = $("envelope");
      const reveal = $("kingReveal");
      countEl.hidden = false; env.hidden = true; reveal.hidden = true;
      countEl.textContent = "";
      const flap = $("flap"); const card = $("envCard");
      if (flap) flap.style.transform = "";
      if (card) { card.style.opacity = "0"; card.style.transform = "translateY(40px)"; }
      playHook("drum", drumSynth);
      for (const n of [3, 2, 1]) {
        countEl.textContent = n;
        if (gsap) gsap.fromTo(countEl, { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" });
        await wait(900);
        if (gen !== enterGen) return;
      }
      if (gen !== enterGen) return;
      countEl.hidden = true;
      env.hidden = false;
      if (window.gsap) {
        gsap.fromTo(env, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4 });
        gsap.to("#flap", { rotateX: -160, duration: 0.7, delay: 0.35, ease: "power2.inOut" });
        gsap.to("#envCard", { y: -70, opacity: 1, duration: 0.5, delay: 0.7 });
      }
      await wait(1600);
      if (gen !== enterGen) return;
      env.hidden = true;
      reveal.hidden = false;
      shake();
      cameraFlash();
      burstConfetti({ particleCount: 220, spread: 120 });
      fireworksShow(4000);
      playHook("fanfare", fanfareSynth);
      playHook("applause", applauseSynth);
      if (window.gsap) {
        gsap.fromTo("#crown", { y: -180, rotate: -25, opacity: 0 }, { y: -10, rotate: 0, opacity: 1, duration: 0.8, ease: "bounce.out" });
        gsap.fromTo(reveal, { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5 });
      }
    }

    function animateCredits() {
      spawnFloaters("love");
      clearInterval(creditsTimer);
      creditsTimer = setInterval(() => spawnFloaters("love"), 1800);

      const crawl = $("creditsCrawl");
      const wrap = $("creditsWrap");
      if (crawl && wrap) {
        if (creditsTween) {
          creditsTween.kill();
          creditsTween = null;
        }

        if (window.gsap) {
          const wrapH = wrap.clientHeight || (window.innerHeight * 0.8);
          const crawlH = crawl.offsetHeight || 380;
          gsap.set(crawl, { y: wrapH, opacity: 1 });

          const totalDistance = wrapH + crawlH + 30;
          const duration = Math.max(20, totalDistance / 38);

          creditsTween = gsap.to(crawl, {
            y: -crawlH - 30,
            duration: duration,
            ease: "none",
            repeat: -1,
            repeatDelay: 1.2
          });
        } else {
          crawl.classList.remove("css-crawl");
          void crawl.offsetWidth;
          crawl.classList.add("css-crawl");
        }

        if (!wrap.dataset.bound) {
          wrap.dataset.bound = "1";
          wrap.addEventListener("mouseenter", () => { if (creditsTween) creditsTween.pause(); });
          wrap.addEventListener("mouseleave", () => { if (creditsTween) creditsTween.play(); });
        }
      }
    }

    function animateFinale() {
      spawnFloaters("love");
      burstConfetti({ particleCount: 260, spread: 160 });
      fireworksShow(3500);
      playHook("fanfare", fanfareSynth);
    }

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    /* Parallax */
    document.addEventListener("mousemove", (e) => {
      const c = $("cursor");
      c.style.left = e.clientX + "px"; c.style.top = e.clientY + "px";
      const active = slides()[index];
      if (!active) return;
      const p = active.querySelector("[data-parallax]");
      if (!p) return;
      const dx = (e.clientX / innerWidth - 0.5) * 16;
      const dy = (e.clientY / innerHeight - 0.5) * 12;
      p.style.transform = `rotateY(${dx}deg) rotateX(${-dy}deg) translateZ(12px)`;
    });

    /* Sparkles in gold frames */
    function fillSparkles() {
      document.querySelectorAll("[data-sparkle]").forEach(box => {
        box.innerHTML = "";
        for (let i = 0; i < 18; i++) {
          const s = document.createElement("i");
          s.style.left = Math.random() * 100 + "%";
          s.style.top = Math.random() * 100 + "%";
          s.style.animationDelay = Math.random() * 2 + "s";
          box.appendChild(s);
        }
      });
    }

    /* Nav */
    function next() { go(index + 1, 1); }
    function prev() { go(index - 1, -1); }

    document.addEventListener("keydown", (e) => {
      if (!started) return;
      if (["ArrowRight", "ArrowDown", " ", "PageDown", "Enter"].includes(e.key)) { e.preventDefault(); next(); }
      if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); prev(); }
    });

    let pointerStart = null;
    slidesEl.addEventListener("pointerdown", (e) => { pointerStart = { x: e.clientX, y: e.clientY, t: Date.now() }; });
    slidesEl.addEventListener("pointerup", (e) => {
      if (!started || !pointerStart) return;
      const dx = e.clientX - pointerStart.x;
      const dy = e.clientY - pointerStart.y;
      const dt = Date.now() - pointerStart.t;
      if (Math.abs(dx) > 50 && dt < 800) { dx < 0 ? next() : prev(); }
      else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
        e.clientX > innerWidth / 2 ? next() : prev();
      }
      pointerStart = null;
    });

    $("btnConfetti").addEventListener("click", () => burstConfetti());
    $("btnMusic").addEventListener("click", () => musicOn ? stopMusic() : startMusic());
    $("btnFull").addEventListener("click", () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    });

    $("btnStart").addEventListener("click", async () => {
      started = true;
      $("gate").style.display = "none";
      audioCtx();
      startMusic();
      $("curtains").classList.add("open");
      slides()[0].classList.add("active");
      updateHud();
      playEnter(slides()[0]);
    });

    window.addEventListener("resize", resizeFx);
    buildSlides();
    fillSparkles();
    resizeFx();
    spawnParticles();
    tickParticles();
    tickFireworks();
    updateHud();
  </script>
</body>
</html>
